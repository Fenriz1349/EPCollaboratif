name: iOS Build and Test

on:
  pull_request:
    branches:
      - main

permissions:
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: macos-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build number
        run: xcrun agvtool new-version -all ${{ github.run_number }}

      - name: Build
        uses: sersoft-gmbh/xcodebuild-action@v4.0.0
        with:
          project: EPCollaboratif.xcodeproj
          scheme: EPCollaboratif
          destination: 'platform=iOS Simulator,name=iPhone 17'
          action: build

  test:
    runs-on: macos-latest
    needs: build
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build number
        run: xcrun agvtool new-version -all ${{ github.run_number }}

      - name: Test
        uses: sersoft-gmbh/xcodebuild-action@v4.0.0
        with:
          project: EPCollaboratif.xcodeproj
          scheme: EPCollaboratif
          destination: 'platform=iOS Simulator,name=iPhone 17'
          action: test
          result-bundle-path: 'TestResults/TestResults.xcresult'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults/TestResults.xcresult
        if: success() || failure()

  report:
    runs-on: macos-latest
    needs: test
    if: ${{ !startsWith(github.head_ref, 'release-please--') && (success() || failure()) }}

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: TestResults
          path: TestResults/TestResults.xcresult

      - name: Generate test report
        run: |
          xcrun xcresulttool get test-results summary \
            --path TestResults/TestResults.xcresult \
            --format json > summary.json

          {
            echo "## Test Report"
            echo ""
            echo "| Metric | Value |"
            echo "| --- | --- |"
            jq -r '
              "| Result | \(.result) |",
              "| Total tests | \(.totalTestCount) |",
              "| Passed | \(.passedTests) |",
              "| Failed | \(.failedTests) |",
              "| Skipped | \(.skippedTests) |"
            ' summary.json
          } >> "$GITHUB_STEP_SUMMARY"

          failing=$(jq -r '.failedTests' summary.json)
          if [ "$failing" -gt 0 ]; then
            {
              echo ""
              echo "### Failures"
              echo ""
              jq -r '.testFailures[]? | "- **\(.testName)**: \(.failureText)"' summary.json
            } >> "$GITHUB_STEP_SUMMARY"
          fi
