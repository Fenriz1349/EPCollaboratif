name: iOS Build and Test

on:
  pull_request:
    branches:
      - main

permissions:
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: macos-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build number
        run: xcrun agvtool new-version -all ${{ github.run_number }}

      - name: Build
        uses: sersoft-gmbh/xcodebuild-action@v3.2.0
        with:
          project: EPCollaboratif.xcodeproj
          scheme: EPCollaboratif
          destination: 'platform=iOS Simulator,name=iPhone 17'
          action: build

  test:
    runs-on: macos-latest
    needs: build
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build number
        run: xcrun agvtool new-version -all ${{ github.run_number }}

      - name: Test
        uses: sersoft-gmbh/xcodebuild-action@v3.2.0
        with:
          project: EPCollaboratif.xcodeproj
          scheme: EPCollaboratif
          destination: 'platform=iOS Simulator,name=iPhone 17'
          action: test
          result-bundle-path: 'TestResults/TestResults.xcresult'

      - name: Convert test results to JUnit
        run: |
          brew install chargepoint/xcresultparser/xcresultparser
          xcresultparser --output-format junit \
            TestResults/TestResults.xcresult > TestResults/results.junit.xml
        if: success() || failure()

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'TestResults/results.junit.xml'
          check_name: 'Test Results'
        if: success() || failure()

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults/TestResults.xcresult
        if: success() || failure()
