name: iOS Build and Test

on:
  pull_request:
    branches:
      - main

permissions:
  checks: write
  pull-requests: write

jobs:
  build:
    runs-on: macos-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build number
        run: xcrun agvtool new-version -all ${{ github.run_number }}

      - name: Build
        uses: sersoft-gmbh/xcodebuild-action@v4.0.0
        with:
          project: EPCollaboratif.xcodeproj
          scheme: EPCollaboratif
          destination: 'platform=iOS Simulator,name=iPhone 17'
          action: build

  test:
    runs-on: macos-latest
    needs: build
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build number
        run: xcrun agvtool new-version -all ${{ github.run_number }}

      - name: Test
        uses: sersoft-gmbh/xcodebuild-action@v4.0.0
        with:
          project: EPCollaboratif.xcodeproj
          scheme: EPCollaboratif
          destination: 'platform=iOS Simulator,name=iPhone 17'
          action: test
          result-bundle-path: 'TestResults/TestResults.xcresult'

      - name: Convert test results to JUnit
        run: |
          xcrun xcresulttool get --legacy --path TestResults/TestResults.xcresult --format json \
            | python3 -c "
import sys, json
from xml.etree.ElementTree import Element, SubElement, tostring
from xml.dom.minidom import parseString

data = json.load(sys.stdin)
suites = Element('testsuites')

for suite in data.get('tests', [{}])[0].get('subtests', [{}])[0].get('subtests', []):
    ts = SubElement(suites, 'testsuite', name=suite.get('name', ''))
    for test in suite.get('subtests', []):
        tc = SubElement(ts, 'testcase',
            classname=suite.get('name', ''),
            name=test.get('name', ''),
            time=str(test.get('duration', 0)))
        if test.get('testStatus') == 'Failure':
            SubElement(tc, 'failure', message='Test failed')

print(parseString(tostring(suites)).toprettyxml(indent='  '))
" > TestResults/results.junit.xml
        if: success() || failure()

      - name: Publish test report
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'TestResults/results.junit.xml'
          check_name: 'Test Results'
          include_passed: true
        if: success() || failure()

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults/TestResults.xcresult
        if: success() || failure()
